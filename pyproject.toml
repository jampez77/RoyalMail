[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["custom_components"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "A", "ASYNC", "B", "C4", "D", "E", "F", "FLY", "G", "I", "ICN", "LOG",
    "N804", "N805", "N815", "PERF", "PGH", "PIE", "PL", "PT", "PYI", "RET",
    "RSE", "RUF", "S", "SIM", "SLOT", "T20", "TC", "TID", "TRY", "UP", "W",
]
ignore = [
    "ASYNC109", # Async function definition with a `timeout` parameter
    "D202",    # No blank lines allowed after function docstring
    "D203",    # 1 blank line required before class docstring
    "D213",    # Multi-line docstring summary should start at the second line
    "E501",    # Line length is handled by the formatter
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value used in comparison
    "TRY003",  # Long messages outside exception classes
    "TRY300",  # Consider moving statement into the else clause
    "TRY301",  # Abstract raise to an inner function
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]
combine-as-imports = true
split-on-trailing-comma = false
# Keep Home Assistant imports in their own block, as core does.
section-order = [
    "future", "standard-library", "third-party", "homeassistant", "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
homeassistant = ["homeassistant"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "D104", "S101", "S105", "S106", "SLF001", "PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
ignore_missing_imports = true
